      <stop offset="100%" stop-color="#09090b" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="104" fill="#09090b" />
  <circle cx="256" cy="256" r="220" fill="url(#glowGrad)" />
