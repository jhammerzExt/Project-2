<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        function shouldSuppress(str) {
          if (!str) return false;
          var s = String(str);
          return s.indexOf('WebSocket') !== -1 || 
                 s.indexOf('vite') !== -1 || 
                 s.indexOf('closed without opened') !== -1 ||
                 s.indexOf('WebChannelConnection') !== -1 ||
                 s.indexOf('transport errored') !== -1 ||
                 s.indexOf('interrupted') !== -1 ||
                 s.indexOf('no-speech') !== -1 ||
                 s.indexOf('429') !== -1 ||
                 s.indexOf('quota') !== -1 ||
                 s.indexOf('QUOTA_EXCEEDED') !== -1 ||
                 s.indexOf('aborted') !== -1;
        }
        var origWarn = console.warn;
        console.warn = function() {
          var args = Array.prototype.slice.call(arguments);
          var joined = args.map(function(a) { return String((a && a.message) || a); }).join(' ');
          if (shouldSuppress(joined)) return;
          return origWarn.apply(console, arguments);
        };
        var origError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var joined = args.map(function(a) { return String((a && a.message) || a); }).join(' ');
          if (shouldSuppress(joined)) return;
          return origError.apply(console, arguments);
        };
        window.addEventListener('unhandledrejection', function(e) {
          var reason = e && e.reason ? (e.reason.message || e.reason) : '';
          if (shouldSuppress(reason)) {
            e.preventDefault();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('error', function(e) {
          var msg = e ? (e.message || (e.error && e.error.message) || e.error) : '';
          if (shouldSuppress(msg)) {
            e.preventDefault();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
          }
        }, true);
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            for (var i = 0; i < regs.length; i++) {
              regs[i].unregister();
            }
          }).catch(function() {});
        }
      })();
    </script>
